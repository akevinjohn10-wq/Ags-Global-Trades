<style>
/* Layout: full-bleed space scene, copy on the left, globe set right of centre (centred and lower on phones) */
:root {
  --space: #02050D;
  --navy: #0A1640;
  --blue: #23408E;
  --sky: #8FB0FF;
  --text: #F3F5FA;
  --muted: rgba(243, 245, 250, 0.68);
  --line: rgba(184, 196, 230, 0.18);
  --font-sans: Geist, Inter, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--space); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
.stage { position: relative; height: 100%; min-height: 560px; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#gl { cursor: grab; touch-action: none; }
#gl.dragging { cursor: grabbing; }
#fx { pointer-events: none; }
.shade { position: absolute; inset: 0 auto 0 0; width: 52%; pointer-events: none; background: linear-gradient(90deg, rgba(2,5,13,0.92), rgba(2,5,13,0.55) 60%, transparent); }

.nav { position: absolute; inset: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand .div { width: 1px; height: 30px; background: rgba(255,255,255,0.25); }
.brand .words { font-size: 11px; font-weight: 500; letter-spacing: 0.32em; line-height: 1.45; }
.tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; border: 1px solid var(--line); padding: 7px 10px; border-radius: 4px; }

.copy { position: absolute; left: 0; top: 50%; transform: translateY(-50%); max-width: 600px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.eyebrow { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #B8C4E6; }
.eyebrow::before { content: ""; width: 8px; height: 8px; background: var(--sky); }
h1 { margin: 20px 0 0; font-size: clamp(48px, 7vw, 112px); font-weight: 500; line-height: 0.92; letter-spacing: -0.045em; text-wrap: balance; }
h1 span { display: block; }
h1 span:last-child { color: var(--sky); }
.lede { margin: 26px 0 0; max-width: 30em; font-size: 17px; line-height: 1.65; color: var(--muted); }
.btns { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; pointer-events: auto; }
.btn { font: 500 14px/1 var(--font-sans); padding: 15px 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: var(--text); cursor: pointer; white-space: nowrap; }
.btn.light { background: var(--text); color: var(--navy); border-color: var(--text); }
.btn:focus-visible, .ctl:focus-visible, .close:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }

.bar { position: absolute; inset: auto 0 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
.ctls { display: flex; gap: 8px; pointer-events: auto; }
.ctl { font: 500 12px/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text); background: rgba(10,22,64,0.55); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; backdrop-filter: blur(6px); }

.tip { position: absolute; transform: translate(14px, -50%); pointer-events: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #fff; background: rgba(10,22,64,0.8); border: 1px solid rgba(143,176,255,0.35); padding: 6px 9px; white-space: nowrap; border-radius: 3px; }
.card { position: absolute; right: max(28px, env(safe-area-inset-right, 0px)); bottom: 76px; width: min(340px, calc(100% - 32px)); background: rgba(6,12,32,0.86); border: 1px solid rgba(143,176,255,0.28); border-radius: 12px; padding: 20px 20px 22px; backdrop-filter: blur(10px); box-shadow: 0 30px 80px -30px rgba(0,0,0,0.8); }
.card .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sky); }
.card h2 { margin: 10px 0 0; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; }
.card .c { margin-top: 2px; font-size: 14px; color: var(--muted); }
.card p { margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: rgba(243,245,250,0.8); }
.card .row { margin-top: 14px; display: flex; gap: 18px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; color: #B8C4E6; font-variant-numeric: tabular-nums; }
.close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; font-size: 16px; line-height: 1; }

@media (max-width: 900px) {
  .shade { width: 100%; height: 55%; background: linear-gradient(180deg, rgba(2,5,13,0.95), rgba(2,5,13,0.6) 70%, transparent); }
  .copy { top: 96px; transform: none; padding-left: max(20px, env(safe-area-inset-left, 0px)); }
  h1 { font-size: clamp(42px, 12vw, 72px); }
  .lede { font-size: 15px; margin-top: 16px; }
  .btns { margin-top: 20px; }
  .hint, .tag { display: none; }
  .card { bottom: 70px; }
  .nav { padding-left: max(20px, env(safe-area-inset-left, 0px)); }
  .bar { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
}
</style>

    for (let j = 0; j <= N; j++) {
      const t = j / N, ang = start + t * R.len * Math.PI * 2;
      const P = [ (R.a[0] * Math.cos(ang) + R.b[0] * Math.sin(ang)) * R.r, (R.a[1] * Math.cos(ang) + R.b[1] * Math.sin(ang)) * R.r, (R.a[2] * Math.cos(ang) + R.b[2] * Math.sin(ang)) * R.r ];
      const p = project(P, C, B);
      if (prev && p && !p.hidden && !prev.hidden) {
        const k = Math.sin(Math.PI * t);
        ctx.strokeStyle = `rgba(200,208,255,${(k * 0.55 * alpha).toFixed(3)})`; ctx.lineWidth = R.w;
        ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      }
      prev = p;
    }
  }
  // sparkles: small twinkling nodes with a cross glint
  for (const s of sparkles) {
    const P = apply(M, s.L); const p = project(P, C, B); if (!p || p.hidden) continue;
    const tw = Math.max(0, Math.sin(S.time * s.sp + s.ph)); const a = tw * tw * alpha;
    if (a < 0.05) continue;
    const r = 2 + tw * 5;
    ctx.strokeStyle = `rgba(235,240,255,${(a * 0.8).toFixed(3)})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(p.x - r, p.y); ctx.lineTo(p.x + r, p.y); ctx.moveTo(p.x, p.y - r); ctx.lineTo(p.x, p.y + r); ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`; ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2); ctx.fill();
  }
}

/* ---------- interaction ---------- */
function pointer(e) { const r = fx.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
let downAt = null;
glCanvas.addEventListener('pointerdown', e => {
  glCanvas.setPointerCapture(e.pointerId);
  S.dragging = true; S.flying = null; glCanvas.classList.add('dragging');
  [S.lastX, S.lastY] = pointer(e); downAt = [S.lastX, S.lastY, performance.now()];
  S.vy = S.vp = 0;
});
glCanvas.addEventListener('pointermove', e => {
  const [x, y] = pointer(e);
  if (S.dragging) {
    const k = 0.0042 * (mobile ? 1.3 : 1) / scale;
    const dx = (x - S.lastX) * k, dy = (y - S.lastY) * k;
    S.yaw += dx; S.pitch = clamp(S.pitch + dy, -1.1, 1.1);
    S.vy = dx; S.vp = dy; S.idle = 0;
    S.lastX = x; S.lastY = y;
  } else {
    S.hover = pick(x, y);
    glCanvas.style.cursor = S.hover ? 'pointer' : '';
  }
});
function endDrag(e) {
  if (!S.dragging) return;
  S.dragging = false; glCanvas.classList.remove('dragging');
  const [x, y] = pointer(e);
  if (downAt && Math.hypot(x - downAt[0], y - downAt[1]) < 5 && performance.now() - downAt[2] < 400) {
    const hit = pick(x, y);
    if (hit) select(hit); else if (S.selected) deselect();
    S.vy = S.vp = 0;
  }
}
glCanvas.addEventListener('pointerup', endDrag);
glCanvas.addEventListener('pointercancel', endDrag);
glCanvas.addEventListener('pointerleave', () => { if (!S.dragging) S.hover = null; });

let screenPins = [];
function pick(x, y) {
  let best = null, bd = 18;
  for (const p of screenPins) { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p.hub; } }
  return best;
}

const card = document.getElementById('card');
function flyTo(hub) {
  S.flying = { yaw: -hub.lon * D2R, pitch: clamp(hub.lat * D2R, -0.9, 0.9) };
}
function select(hub) {
  S.selected = hub; flyTo(hub);
  const isHome = hub === HOME;
  document.getElementById('cardK').textContent = isHome ? 'Home base' : hub.region;
  document.getElementById('cardH').textContent = hub.name;
  document.getElementById('cardC').textContent = hub.country;
  document.getElementById('cardP').textContent = hub.note;
  const R = document.getElementById('cardR'); R.textContent = '';
  const a = document.createElement('span'); a.textContent = `${Math.abs(hub.lat).toFixed(2)}°${hub.lat >= 0 ? 'N' : 'S'}  ${Math.abs(hub.lon).toFixed(2)}°${hub.lon >= 0 ? 'E' : 'W'}`;
  R.appendChild(a);
  if (!isHome) {
    const km = Math.round(Math.acos(clamp(dot(homeL, ll(hub.lat, hub.lon)), -1, 1)) * 6371);
    const b = document.createElement('span'); b.textContent = `${km.toLocaleString('en-IN')} km from Delhi`; R.appendChild(b);
  }
  card.hidden = false;
}
function deselect() { S.selected = null; card.hidden = true; }
document.getElementById('close').addEventListener('click', () => { deselect(); S.flying = { yaw: HOME_YAW, pitch: HOME_PITCH }; });
document.getElementById('reset').addEventListener('click', () => { deselect(); S.flying = { yaw: HOME_YAW, pitch: HOME_PITCH }; });
document.getElementById('replay').addEventListener('click', () => { deselect(); S.intro = 0; S.t0 = performance.now(); S.yaw = -18*D2R; S.pitch = 34*D2R; S.vy = S.vp = 0; S.flying = null; S.idle = 0; });

/* ---------- loop ---------- */
const tip = document.getElementById('tip');
let last = performance.now();
const INTRO_MS = 4200;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  S.time += dt;
  // keep it smooth: drop render resolution a step if frames run long, raise it again when there is headroom
  if (dt > 0.024) slow++; else slow = Math.max(0, slow - 1);
  if (dt < 0.012) fast++; else fast = 0;
  if (slow > 40 && quality > 0.5) { quality -= 0.15; slow = 0; resize(); }
  if (fast > 240 && quality < 1) { quality = Math.min(1, quality + 0.15); fast = 0; resize(); }
  R_STATE.real += (R_STATE.target - R_STATE.real) * Math.min(1, dt * 2.2);
  if (S.intro < 1) {
    S.intro = clamp((now - S.t0) / INTRO_MS, 0, 1);
    const k = ease(S.intro);
    S.yaw = lerp(-18*D2R, HOME_YAW, k); S.pitch = lerp(34*D2R, HOME_PITCH, k);
  } else if (S.flying) {
    S.yaw += (S.flying.yaw - S.yaw) * Math.min(1, dt * 3.2);
    S.pitch += (S.flying.pitch - S.pitch) * Math.min(1, dt * 3.2);
    if (Math.abs(S.flying.yaw - S.yaw) < 1e-3 && Math.abs(S.flying.pitch - S.pitch) < 1e-3) S.flying = null;
  } else if (!S.dragging) {
    // inertia, then a slow drift back and forth around Delhi
    S.yaw += S.vy; S.pitch = clamp(S.pitch + S.vp, -1.1, 1.1);
    S.vy *= Math.pow(0.04, dt); S.vp *= Math.pow(0.04, dt);
    S.idle += dt;
    if (!S.selected && S.idle > 3.5 && !reduce) {
      const w = Math.min(1, (S.idle - 3.5) / 4) * dt * 0.22;
      S.yaw += w * 0.5;   // slow eastward spin so every region comes into view
      S.pitch += (HOME_PITCH - S.pitch) * w;
    }
  }

  scale = 1;
  const C = camera(); const B = basis(C.cam, C.target);
  const M = rotMat(S.yaw, S.pitch);

  gl.uniform2f(U.uRes, glCanvas.width, glCanvas.height);
  gl.uniform2f(U.uCenter, C.cx * glCanvas.width, C.cy * glCanvas.height);
  gl.uniform1f(U.uScale, scale);
  gl.uniform3fv(U.uCam, C.cam); gl.uniform3fv(U.uTarget, C.target); gl.uniform3fv(U.uSun, C.sun);
  // column-major upload of M so that  n * uRot  ==  M^T n  (world -> local)
  gl.uniformMatrix3fv(U.uRot, false, new Float32Array([M[0][0], M[1][0], M[2][0], M[0][1], M[1][1], M[2][1], M[0][2], M[1][2], M[2][2]]));
  gl.uniform1f(U.uTime, S.time);
  gl.uniform1f(U.uReal, R_STATE.real); gl.uniform1f(U.uHasWater, R_STATE.water); gl.uniform1f(U.uHasTopo, R_STATE.topo);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  drawOverlay(C, B, M);
  requestAnimationFrame(frame);
}

function drawOverlay(C, B, M) {
  ctx.clearRect(0, 0, W, H);
  drawDeco(C, B, M, clamp((S.intro - 0.35) / 0.4, 0, 1));
  const reveal = clamp((S.intro - 0.62) / 0.38, 0, 1); // pins and routes come in as the camera settles
  screenPins = [];
  if (reveal <= 0) { tip.hidden = true; return; }
  const t = S.time;

  // routes
  ctx.lineCap = 'round';
  for (const R of routes) {
    const grow = clamp((reveal - R.delay * 0.5) / 0.5, 0, 1);
    if (grow <= 0) continue;
    const n = Math.floor(grow * (R.pts.length - 1));
    const proj = R.pts.slice(0, n + 1).map(p => project(apply(M, p), C, B));
    const lit = S.selected && (S.selected === R.hub || S.selected === HOME);
    ctx.lineWidth = lit ? 1.8 : 1.2;
    for (let j = 1; j < proj.length; j++) {
      const a = proj[j-1], b = proj[j]; if (!a || !b || a.hidden || b.hidden) continue;
      const fade = Math.sin(Math.PI * j / (R.pts.length - 1));
      ctx.strokeStyle = `rgba(210,216,255,${((lit ? 0.85 : 0.40) + fade * 0.2).toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    // travelling light along the route
    if (grow >= 1) {
      const head = ((t * R.speed + R.phase) % 1.3);
      if (head < 1) {
        const len = 10;
        const hi = Math.floor(head * (R.pts.length - 1));
        for (let j = Math.max(1, hi - len); j <= hi; j++) {
          const a = project(apply(M, R.pts[j-1]), C, B), b = project(apply(M, R.pts[j]), C, B);
          if (!a || !b || a.hidden || b.hidden) continue;
          const k = 1 - (hi - j) / len;
          ctx.strokeStyle = `rgba(220,232,255,${(k * 0.95).toFixed(3)})`; ctx.lineWidth = 1.2 + k * 1.6;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
  }

  // pins
  const all = [{ hub: HOME, L: homeL, home: true }, ...routes.map(r => ({ hub: r.hub, L: r.L }))];
  for (const p of all) {
    const W3 = apply(M, p.L);
    const s = project([W3[0]*1.003, W3[1]*1.003, W3[2]*1.003], C, B);
    if (!s || s.hidden) continue;
    // fade pins near the limb
    const facing = dot(W3, norm(sub(C.cam, W3)));
    const a = clamp(facing * 4, 0, 1) * reveal;
    if (a <= 0.02) continue;
    screenPins.push({ x: s.x, y: s.y, hub: p.hub });
    const active = S.selected === p.hub || S.hover === p.hub;
    if (p.home) {
      for (let k = 0; k < 2; k++) {
        const ph = (t * 0.6 + k * 0.5) % 1;
        ctx.strokeStyle = `rgba(255,255,255,${((1 - ph) * 0.6 * a).toFixed(3)})`; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(s.x, s.y, 5 + ph * 22, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(s.x, s.y, 4.5, 0, Math.PI*2); ctx.fill();
      ctx.font = '500 11px "Geist Mono", ui-monospace, monospace';
      const label = 'NEW DELHI · HQ';
      const w = ctx.measureText(label).width + 16;
      ctx.fillStyle = `rgba(35,64,142,${0.88 * a})`; ctx.fillRect(s.x + 14, s.y - 11, w, 22);
      ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillText(label, s.x + 22, s.y + 4);
    } else {
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, active ? 16 : 11);
      g.addColorStop(0, `rgba(143,176,255,${0.55 * a})`); g.addColorStop(1, 'rgba(143,176,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, active ? 16 : 11, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = `rgba(220,232,255,${a})`; ctx.beginPath(); ctx.arc(s.x, s.y, active ? 4 : 3, 0, Math.PI*2); ctx.fill();
      if (active) { ctx.strokeStyle = `rgba(255,255,255,${0.8*a})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, Math.PI*2); ctx.stroke(); }
    }
  }

  // hover label
  const hv = S.hover && S.hover !== HOME && screenPins.find(p => p.hub === S.hover);
  if (hv) { tip.hidden = false; tip.textContent = `${hv.hub.name} · ${hv.hub.country}`; tip.style.left = hv.x + 'px'; tip.style.top = hv.y + 'px'; }
  else tip.hidden = true;
}
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
