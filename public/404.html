    <style>
      :root { --ink: #1b1e24; --mist: #ecf0f8; --accent: #111317; --muted: #62677a; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body { font-family: Geist, Inter, system-ui, sans-serif; background: #fff; color: var(--ink); overflow: hidden; display: flex; flex-direction: column; }
      header { background: var(--ink); padding: 18px clamp(20px, 4vw, 48px); display: flex; align-items: center; justify-content: space-between; }
      header img { height: 46px; width: auto; display: block; }
      .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; }
      header .mono { color: rgba(255,255,255,.6); }
      main { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
      .backdrop { position: absolute; inset: 0; display: flex; align-items: center; overflow: hidden; pointer-events: none; }
      .track { display: flex; width: max-content; animation: slide 28s linear infinite; }
      .track span { font-family: Geist, Inter, sans-serif; font-weight: 500; font-size: clamp(90px, 18vw, 260px); line-height: 1; color: transparent; -webkit-text-stroke: 2px #d3dcee; white-space: nowrap; padding-right: .4em; }
      @keyframes slide { to { transform: translateX(-50%); } }
      .scene { position: relative; height: clamp(170px, 26vw, 300px); margin-top: auto; }
      .road { position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: var(--ink); }
      .road::after { content: ''; position: absolute; left: 0; right: 0; top: 46%; height: 4px; background: repeating-linear-gradient(90deg, #fff 0 40px, transparent 40px 80px); animation: lane 0.8s linear infinite; opacity: .8; }
      @keyframes lane { to { background-position: -80px 0; } }
      .truck { position: absolute; bottom: 20%; left: 50%; width: clamp(280px, 44vw, 560px); transform: translateX(-50%); animation: drive 2.4s cubic-bezier(.16,1,.3,1) both, bob 0.6s ease-in-out 2.4s infinite alternate; }
      @keyframes drive { from { transform: translateX(-180%); } to { transform: translateX(-50%); } }
      @keyframes bob { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(-2px); } }
      .copy { position: relative; z-index: 2; padding: 0 clamp(20px, 4vw, 48px); margin-top: auto; }
      .eyebrow { display: inline-flex; align-items: center; gap: 12px; color: var(--muted); }
      .eyebrow::before { content: ''; width: 8px; height: 8px; background: var(--accent); }
      h1 { font-family: Geist, Inter, sans-serif; font-weight: 600; font-size: clamp(38px, 7vw, 96px); line-height: .95; margin-top: 16px; letter-spacing: -.015em; }
      p.lead { margin-top: 16px; max-width: 460px; color: var(--muted); font-size: 18px; line-height: 1.6; }
      .actions { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }
      .btn { display: inline-flex; align-items: center; gap: 14px; height: 48px; padding: 0 6px 0 20px; border-radius: 6px; font-weight: 500; font-size: 15px; text-decoration: none; transition: background .3s, color .3s; }
      .btn .box { width: 36px; height: 36px; border-radius: 4px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.15); }
      .btn.primary { background: var(--accent); color: #fff; }
      .btn.primary:hover { background: var(--ink); }
      .btn.outline { border: 1px solid rgba(27,30,36,.15); color: var(--ink); }
      .btn.outline .box { background: rgba(27,30,36,.05); }
      .btn.outline:hover { background: var(--ink); color: #fff; }
      @media (prefers-reduced-motion: reduce) { .track, .road::after, .truck { animation: none !important; transform: translateX(-50%); } .track { transform: none; } }
    </style>
  </head>
